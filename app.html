<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action-First Hub - Interactive Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Trust Bar -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center text-xs sm:text-sm">
            <a href="index.html" class="flex items-center gap-2 font-semibold tracking-wide text-emerald-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>KEMBALI KE KATALOG UTAMA</span>
            </a>
            <div class="text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                <span>Action-First Shell v2.1</span>
            </div>
        </div>
    </header>

    <!-- Dynamic Module Container -->
    <main id="moduleContainer" class="max-w-4xl mx-auto px-4 py-8 space-y-10 flex-grow w-full">
        <div class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600 mb-3"></i>
            <p class="text-xs text-slate-500">Memuat modul interaktif buku...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-12">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 Action-First Hub. Sistem Modular Mandiri (Offline LocalStorage).</p>
            <div class="flex items-center gap-4">
                <a href="index.html" class="hover:text-white transition">Beranda</a>
                <span>&bull;</span>
                <span class="text-emerald-400">Terproteksi Aman</span>
            </div>
        </div>
    </footer>

    <script src="assets/js/security.js"></script>
    <script src="assets/js/core.js"></script>
    <script>
        // Router otomatis berdasarkan parameter URL ?book=id
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('book');
            if(bookId) {
                loadModuleContent(bookId);
            } else {
                document.getElementById('moduleContainer').innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 p-6 rounded-xl text-center space-y-3">
                        <h2 class="font-bold text-amber-900 text-lg">Modul Tidak Ditemukan</h2>
                        <p class="text-xs text-amber-700">Silakan pilih buku dari katalog utama.</p>
                        <a href="index.html" class="inline-block px-4 py-2 bg-amber-600 text-white rounded-lg text-xs font-bold">Buka Katalog</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
